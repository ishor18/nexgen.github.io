<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-1931185774726426">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen | Read Article</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <!-- Dynamic SEO Meta -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="NexGen">
    <meta name="twitter:card" content="summary_large_image">
    <meta id="meta-og-title" property="og:title" content="NexGen Article">
    <meta id="meta-og-desc" property="og:description" content="Read this insightful article on NexGen.">
    <meta id="meta-og-image" property="og:image" content="">
    <meta id="meta-twitter-title" name="twitter:title" content="NexGen Article">
    <meta id="meta-twitter-desc" name="twitter:description" content="Read this insightful article on NexGen.">
    <meta id="meta-twitter-image" name="twitter:image" content="">
    <style>
        .article-title { font-size: 3.5rem; margin: 1rem 0 2rem; line-height: 1.1; color: var(--text); }
        @media (max-width: 768px) {
            .section { padding: 4rem 1.25rem !important; }
            .article-title { font-size: 2.2rem !important; }
            .blog-main-content img { border-radius: 0.5rem; width: 100% !important; height: auto !important; }
        }
    </style>
</head>

<body>
    <!-- Reading Progress Bar -->
    <div id="reading-progress-container">
        <div id="reading-progress-bar"></div>
    </div>
    <!-- Floating Share Sidebar -->
    <div class="share-sidebar">
        <button onclick="shareOn('facebook')" class="btn btn-outline" style="width: 45px; height: 45px; border-radius: 50%; justify-content: center; background: rgba(15,23,42,0.8);"><i class="fa-brands fa-facebook-f"></i></button>
        <button onclick="shareOn('twitter')" class="btn btn-outline" style="width: 45px; height: 45px; border-radius: 50%; justify-content: center; background: rgba(15,23,42,0.8);"><i class="fa-brands fa-x-twitter"></i></button>
        <button onclick="shareOn('whatsapp')" class="btn btn-outline" style="width: 45px; height: 45px; border-radius: 50%; justify-content: center; background: rgba(15,23,42,0.8); color: #25D366; border-color: #25D366;"><i class="fa-brands fa-whatsapp"></i></button>
        <button onclick="shareOn('linkedin')" class="btn btn-outline" style="width: 45px; height: 45px; border-radius: 50%; justify-content: center; background: rgba(15,23,42,0.8);"><i class="fa-brands fa-linkedin-in"></i></button>
    </div>

    <nav class="glass navbar-main">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">Nex<span>Gen</span></a>
            <button class="hamburger" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html#blogs">All Blogs</a>
                <a href="auth.html" class="btn btn-outline" id="nav-btn">Login</a>
            </div>
        </div>
    </nav>

    <main class="section">
        <div class="container" style="max-width: 800px;">
            <div id="blog-content-area">
                <!-- Blog content will be injected here -->
                <div style="text-align: center; padding: 5rem;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; color: var(--primary);"></i>
                    <p style="margin-top: 1rem; color: var(--text-muted);">Loading article...</p>
                </div>
            </div>

            <!-- Advertisement Section -->
            <div id="blog-ad-container" class="glass-card"
                style="margin: 4rem 0; text-align: center; padding: 2rem; border-style: dashed; border-color: var(--secondary);">
                <p style="color: var(--text-muted);">IN-ARTICLE ADVERTISEMENT</p>
                <small>Placeholder for Google AdSense</small>
            </div>
            <!-- Related Articles -->
            <div id="related-posts-section" style="margin-top: 5rem; padding-top: 3rem; border-top: 1px solid var(--border);">
                <h3 style="margin-bottom: 2rem;">Read Next</h3>
                <div id="related-posts-container" class="grid grid-cols-2" style="gap: 1.5rem;">
                    <!-- Related posts injected here -->
                    <div class="skeleton" style="height: 150px;"></div>
                    <div class="skeleton" style="height: 150px;"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="section" style="border-top: 1px solid var(--border);">
        <div class="container" style="text-align: center; color: var(--text-muted);">
            &copy; 2026 NexGen. All rights reserved.
        </div>
    </footer>

    <script>
        // Lightbox Zoom/View Logic
        function initLightbox() {
            if (window.lightboxInited) return;
            window.lightboxInited = true;

            // 1. Create structure if missing
            if (!document.getElementById('lightbox')) {
                const lb = document.createElement('div');
                lb.id = 'lightbox';
                lb.className = 'lightbox';
                lb.innerHTML = `
                    <span class="lightbox-close" aria-label="Close lightbox">&times;</span>
                    <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
                    <div class="zoom-hint" id="zoom-hint">
                        <i class="fa-solid fa-arrows-up-down-left-right"></i>
                        Move to pan
                    </div>
                `;
                document.body.appendChild(lb);
            }

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');

            const closeLB = () => {
                if (!lightbox) return;
                lightbox.classList.remove('active');
                setTimeout(() => { 
                    lightbox.style.display = 'none';
                    if (lightboxImg) lightboxImg.classList.remove('zoomed');
                }, 200);
                document.body.style.overflow = '';
            };

            // Close logic
            lightbox.addEventListener('click', (e) => {
                if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close')) {
                    closeLB();
                }
            });

            if (lightboxImg) {
                lightboxImg.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isZoomed = lightboxImg.classList.toggle('zoomed');
                    if (!isZoomed) {
                        lightboxImg.style.transformOrigin = 'center';
                    }
                });

                // Panning logic: Follow mouse movement when zoomed
                lightbox.addEventListener('mousemove', (e) => {
                    if (!lightboxImg.classList.contains('zoomed')) return;
                    
                    const { left, top, width, height } = lightbox.getBoundingClientRect();
                    const x = ((e.clientX - left) / width) * 100;
                    const y = ((e.clientY - top) / height) * 100;
                    
                    lightboxImg.style.transformOrigin = `${x}% ${y}%`;
                });

                // Touch support for panning
                lightbox.addEventListener('touchmove', (e) => {
                    if (!lightboxImg.classList.contains('zoomed')) return;
                    const touch = e.touches[0];
                    const { left, top, width, height } = lightbox.getBoundingClientRect();
                    const x = ((touch.clientX - left) / width) * 100;
                    const y = ((touch.clientY - top) / height) * 100;
                    
                    lightboxImg.style.transformOrigin = `${x}% ${y}%`;
                }, { passive: true });
            }
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLB();
            });

            // Delegation
            document.addEventListener('click', (e) => {
                // If it's an image and not already inside the lightbox
                if (e.target.tagName === 'IMG' && !e.target.closest('.lightbox-content')) {
                    const isZoomable = !e.target.closest('.navbar-main') && 
                                     !e.target.closest('.share-sidebar');

                    if (isZoomable) {
                        e.preventDefault();
                        e.stopPropagation();
                        lightbox.style.display = 'flex';
                        lightbox.offsetHeight; 
                        lightbox.classList.add('active');
                        lightboxImg.src = e.target.src;
                        document.body.style.overflow = 'hidden';

                        // Show hint if it's the first time
                        const hint = document.getElementById('zoom-hint');
                        if (hint && !localStorage.getItem('zoom_hint_shown')) {
                            hint.classList.add('visible');
                            setTimeout(() => {
                                hint.classList.remove('visible');
                                localStorage.setItem('zoom_hint_shown', 'true');
                            }, 3000);
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Mobile nav toggle
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const navMenu = document.getElementById('nav-menu');
            if (hamburgerBtn && navMenu) {
                hamburgerBtn.addEventListener('click', () => navMenu.classList.toggle('active'));
            }

            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');
            const container = document.getElementById('blog-content-area');

            if (!blogId) {
                window.location.href = 'index.html';
                return;
            }

            const { data: blog, error } = await supabase.from('blogs').select('*').eq('id', blogId).single();

            if (error || !blog) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 5rem 2rem;">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 4rem; color: #ef4444; margin-bottom: 2rem;"></i>
                        <h1 style="margin-bottom: 1rem;">Article not found</h1>
                        <p style="color: var(--text-muted); margin-bottom: 2rem;">The article you're looking for might have been moved or deleted.</p>
                        <div style="display: flex; gap: 1rem; justify-content: center;">
                            <button onclick="window.location.reload()" class="btn-retry"><i class="fa-solid fa-rotate-right"></i> Retry</button>
                            <a href="index.html" class="btn btn-primary">Back to Home</a>
                        </div>
                    </div>
                `;
                return;
            }

            document.title = `${blog.title} | NexGen`;

            const authorName = blog.author_name || 'NexGen Author';
            const wordCount = (blog.content || '').split(/\s+/).filter(Boolean).length;
            const readTime = Math.max(1, Math.ceil(wordCount / 200));

            container.innerHTML = `
                <small style="color: var(--primary); text-transform: uppercase; font-weight: 600;">${blog.category}</small>
                <h1 class="article-title">${blog.title}</h1>
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 3rem;">
                    <div style="display: flex; gap: 1rem; align-items: center; color: var(--text-muted);">
                        <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <p style="color: var(--text); font-weight: 500;">${authorName}</p>
                            <p style="font-size: 0.8rem;">${blog.date} • ${readTime} min read</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick="shareOn('facebook')" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Share on Facebook" aria-label="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></button>
                        <button onclick="shareOn('twitter')" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Share on Twitter" aria-label="Share on Twitter"><i class="fa-brands fa-x-twitter"></i></button>
                        <button onclick="shareOn('linkedin')" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Share on LinkedIn" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in"></i></button>
                        <button onclick="shareOn('whatsapp')" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Share on WhatsApp" aria-label="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="shareOn('instagram')" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Share on Instagram" aria-label="Share on Instagram"><i class="fa-brands fa-instagram"></i></button>
                        <button onclick="copyShareLink()" class="btn btn-outline" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;" title="Copy Link" aria-label="Copy shareable link"><i class="fa-solid fa-link"></i></button>
                    </div>
                </div>
                ${blog.image_url ? `
                    <div style="width: 100%; border-radius: 1rem; margin-bottom: 3rem; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 300px;" class="img-container">
                        <img src="${blog.image_url}" class="img-loading" style="max-width: 100%; height: auto; max-height: 500px; object-fit: contain; display: block; margin: 0 auto; border-radius: 0.5rem;" alt="${blog.title}" onload="this.classList.add('img-loaded');">
                    </div>
                ` : `
                    <div style="height: 400px; background: #334155; border-radius: 1rem; margin-bottom: 3rem; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-image" style="font-size: 5rem; color: var(--secondary);"></i>
                    </div>
                `}
                <div class="blog-main-content" style="font-size: 1.1rem; line-height: 1.8; color: var(--text-muted);">
                    ${blog.content}
                </div>

                ${blog.file_id ? `
                    <div id="file-attachment-area" style="margin-top: 4rem; padding: 2rem; background: rgba(37, 99, 235, 0.05); border: 1px solid var(--primary); border-radius: 1rem; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <h4 style="margin-bottom: 0.5rem; color: white;">Attached Resource</h4>
                            <p id="attached-file-name" style="font-size: 0.9rem; color: var(--text-muted);">Loading file info...</p>
                        </div>
                        <a id="download-link" href="#" target="_blank" class="btn btn-primary"><i class="fa-solid fa-download"></i> Download</a>
                    </div>
                ` : ''}

                <!-- Reactions Section -->
                <div style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1.5rem;">What did you think?</h3>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button onclick="addReaction('like')" class="btn btn-outline reaction-btn" data-type="like" style="display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-thumbs-up"></i> Like <span id="count-like" class="reaction-count">0</span>
                        </button>
                        <button onclick="addReaction('love')" class="btn btn-outline reaction-btn" data-type="love" style="display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-heart"></i> Love <span id="count-love" class="reaction-count">0</span>
                        </button>
                        <button onclick="addReaction('insightful')" class="btn btn-outline reaction-btn" data-type="insightful" style="display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fa-solid fa-lightbulb"></i> Insightful <span id="count-insightful" class="reaction-count">0</span>
                        </button>
                    </div>
                </div>

                <!-- Comments Section -->
                <div style="margin-top: 4rem;">
                    <h3 style="margin-bottom: 2rem;">Comments <span id="comment-count" style="color: var(--text-muted); font-size: 1rem;">(0)</span></h3>
                    
                    <!-- Comment Form -->
                    <form id="comment-form" class="glass-card" style="padding: 2rem; margin-bottom: 3rem;">
                        <h4 style="margin-bottom: 1.5rem;">Leave a Comment</h4>
                        <div style="display: grid; gap: 1rem;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                            <input type="text" id="comment-name" required placeholder="Your Name" style="padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white;">
                            <input type="email" id="comment-email" required placeholder="Your Email" style="padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white;">
                        </div>
                            <textarea id="comment-text" required placeholder="Share your thoughts..." style="padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white; min-height: 120px; resize: vertical;"></textarea>
                            <button type="submit" class="btn btn-primary" style="justify-self: start;">
                                <i class="fa-solid fa-paper-plane"></i> Post Comment
                            </button>
                            <p style="font-size: 0.8rem; color: var(--text-muted);">Your comment will be reviewed before being published.</p>
                        </div>
                    </form>

                    <!-- Comments List -->
                    <div id="comments-list"></div>
                </div>
            `;

            if (blog.file_id) {
                const { data: file } = await supabase.from('files').select('*').eq('id', blog.file_id).single();
                if (file) {
                    document.getElementById('attached-file-name').innerText = `${file.name} (${file.size})`;
                    document.getElementById('download-link').href = file.url;
                }
            }


            // Increment view count
            await supabase.rpc('increment_view_count', { blog_id: blogId });

            // Load reactions and comments
            await loadReactions(blogId);
            await loadComments(blogId);

            // Load targeted advertisement
            await renderBlogAd(blogId);

            // Adjust nav button if logged in
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const navBtn = document.getElementById('nav-btn');
                if (navBtn) {
                    navBtn.innerText = 'Dashboard';
                    navBtn.href = 'dashboard.html';
                }
            }

            // Attach comment form event listener (after form is created)
            const commentForm = document.getElementById('comment-form');
            if (commentForm) {
                commentForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    try {
                        console.log('Comment form submitted');

                        const name = document.getElementById('comment-name').value;
                        const email = document.getElementById('comment-email').value;
                        const text = document.getElementById('comment-text').value;

                        console.log('Submitting comment:', { blogId, name, email });

                        const { data, error } = await supabase.from('blog_comments').insert([{
                            blog_id: blogId,
                            author_name: name,
                            author_email: email,
                            comment_text: text,
                            status: 'pending'
                        }]);

                        console.log('Comment submission result:', { data, error });

                        if (error) {
                            console.error('Comment submission error:', error);
                            alert('Failed to submit comment: ' + error.message);
                        } else {
                            console.log('Comment submitted successfully');
                            alert('✅ Thank you! Your comment has been submitted and is awaiting approval.');
                            e.target.reset();
                            // Reload comments to show the count (though it won't show until approved)
                            await loadComments(blogId);
                        }
                    } catch (err) {
                        console.error('Unexpected error during comment submission:', err);
                        alert('An unexpected error occurred. Please try again.');
                    }
                });
            }
            // Update Meta Tags for SEO (after content is fetched)
            if (blog) updateMeta(blog);

            // Progress Bar Logic
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                const progressBar = document.getElementById('reading-progress-bar');
                if (progressBar) progressBar.style.width = scrolled + "%";
            });

            // Initialize Lightbox immediately
            initLightbox();
            
            // Render Related Posts
            renderRelatedPosts(blogId, blog.category);
        });

            async function updateMeta(blog) {
                document.title = `${blog.title} | NexGen`;
                const metaTitle = document.getElementById('meta-og-title');
                const metaDesc = document.getElementById('meta-og-desc');
                const metaImg = document.getElementById('meta-og-image');
                const twTitle = document.getElementById('meta-twitter-title');
                const twDesc = document.getElementById('meta-twitter-desc');
                const twImg = document.getElementById('meta-twitter-image');

                if (metaTitle) metaTitle.content = blog.title;
                if (metaDesc) metaDesc.content = blog.excerpt || 'Read this insightful article on NexGen.';
                if (metaImg) metaImg.content = blog.image_url || '';
                if (twTitle) twTitle.content = blog.title;
                if (twDesc) twDesc.content = blog.excerpt || 'Read this insightful article on NexGen.';
                if (twImg) twImg.content = blog.image_url || '';
            }

        // Load and display reactions
        async function loadReactions(blogId) {
            const { data: reactions } = await supabase.from('blog_reactions').select('*').eq('blog_id', blogId);

            const counts = { like: 0, love: 0, insightful: 0 };
            const userReactions = new Set();
            const userId = getUserIdentifier();

            if (reactions) {
                reactions.forEach(r => {
                    counts[r.reaction_type]++;
                    if (r.user_identifier === userId) {
                        userReactions.add(r.reaction_type);
                    }
                });
            }

            // Update counts
            document.getElementById('count-like').innerText = counts.like;
            document.getElementById('count-love').innerText = counts.love;
            document.getElementById('count-insightful').innerText = counts.insightful;

            // Highlight user's reactions
            userReactions.forEach(type => {
                const btn = document.querySelector(`[data-type="${type}"]`);
                if (btn) btn.style.borderColor = 'var(--primary)';
            });
        }

        // Add reaction
        window.addReaction = async function (type) {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');
            const userId = getUserIdentifier();

            // Check if already reacted
            const { data: existing } = await supabase.from('blog_reactions')
                .select('*')
                .eq('blog_id', blogId)
                .eq('user_identifier', userId)
                .eq('reaction_type', type)
                .single();

            if (existing) {
                // Remove reaction
                await supabase.from('blog_reactions').delete().eq('id', existing.id);
            } else {
                // Add reaction
                await supabase.from('blog_reactions').insert([{
                    blog_id: blogId,
                    reaction_type: type,
                    user_identifier: userId
                }]);
            }

            await loadReactions(blogId);
        };

        // Load and display comments
        async function loadComments(blogId) {
            const { data: comments } = await supabase.from('blog_comments')
                .select('*')
                .eq('blog_id', blogId)
                .eq('status', 'approved')
                .order('created_at', { ascending: false });

            const commentsList = document.getElementById('comments-list');
            const commentCount = document.getElementById('comment-count');

            if (!comments || comments.length === 0) {
                commentsList.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 3rem;">No comments yet. Be the first to share your thoughts!</p>';
                commentCount.innerText = '(0)';
                return;
            }

            commentCount.innerText = `(${comments.length})`;

            commentsList.innerHTML = comments.map(c => {
                const date = new Date(c.created_at).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                return `
                    <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                            <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
                                ${c.author_name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p style="font-weight: 600; color: white;">${c.author_name}</p>
                                <p style="font-size: 0.8rem; color: var(--text-muted);">${date}</p>
                            </div>
                        </div>
                        <p style="color: var(--text-muted); line-height: 1.6;">${c.comment_text}</p>
                    </div>
                `;
            }).join('');
        }
        // Copy share link
        window.copyShareLink = function() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('Link copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Could not copy text: ', err);
            });
        };

        // Share on Social Media
        window.shareOn = function(platform) {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.title);
            let shareUrl = '';
            
            switch(platform) {
                case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`; break;
                case 'twitter': shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${title}`; break;
                case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`; break;
                case 'whatsapp': shareUrl = `https://api.whatsapp.com/send?text=${title} ${url}`; break;
                case 'instagram': 
                    copyShareLink();
                    alert('Instagram sharing: Link copied to clipboard! You can now paste it in your Instagram story or message.');
                    return;
            }
            
            if (shareUrl) {
                window.open(shareUrl, '_blank', 'width=600,height=400');
            }
        };

        // Render Targeted Ad for Blog
        async function renderBlogAd(blogId) {
            const adContainer = document.getElementById('blog-ad-container');
            if (!adContainer) return;

            // 1. Try to find ad specifically for THIS blog
            let { data: ads, error } = await supabase
                .from('site_ads')
                .select('*')
                .eq('is_active', true)
                .eq('placement', 'specific_blog')
                .eq('target_blog_id', blogId)
                .limit(1);

            // 2. Fallback to All Blogs placement
            if ((!ads || ads.length === 0) && !error) {
                const result = await supabase
                    .from('site_ads')
                    .select('*')
                    .eq('is_active', true)
                    .eq('placement', 'all_blogs')
                    .limit(1);
                ads = result.data;
                error = result.error;
            }

            if (!error && ads && ads.length > 0) {
                const ad = ads[0];
                adContainer.style.cssText = 'margin: 4rem 0; padding: 0; background: transparent; border: none;';
                let adHtml = `<img src="${ad.image_url}" style="max-width: 100%; height: auto; border-radius: 0.5rem; display: block; margin: 0 auto; object-fit: contain;" alt="Advertisement">`;
                if (ad.link_url) adHtml = `<a href="${ad.link_url}" target="_blank" rel="noopener" style="display: block;">${adHtml}</a>`;
                adContainer.innerHTML = adHtml;
            } else {
                adContainer.style.display = 'none';
            }
        }

        async function renderRelatedPosts(currentBlogId, category) {
            const container = document.getElementById('related-posts-container');
            if (!container) return;

            const { data: related, error } = await supabase
                .from('blogs')
                .select('id, title, category, image_url, date')
                .eq('category', category)
                .neq('id', currentBlogId)
                .or('status.eq.published,status.is.null')
                .limit(2);

            const posts = (related && related.length > 0) ? related : (await supabase.from('blogs').select('id, title, category, image_url, date').neq('id', currentBlogId).or('status.eq.published,status.is.null').limit(2)).data;

            if (!posts || posts.length === 0) {
                document.getElementById('related-posts-section').style.display = 'none';
                return;
            }

            container.innerHTML = posts.map(p => `
                <a href="blog.html?id=${p.id}" class="glass-card" style="text-decoration: none; padding: 1rem; display: flex; gap: 1rem; align-items: center; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''">
                    <div style="width: 80px; height: 80px; border-radius: 0.5rem; overflow: hidden; background: #1e293b; flex-shrink: 0;">
                        <img src="${p.image_url || 'https://via.placeholder.com/150'}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div>
                        <small style="color: var(--primary); font-weight: 600; text-transform: uppercase; font-size: 0.7rem;">${p.category}</small>
                        <h4 style="color: white; font-size: 0.95rem; margin: 0.2rem 0 0; line-height: 1.3;">${p.title}</h4>
                    </div>
                </a>
            `).join('');
        }

        // Helper: Persistent unique ID for anonymous reactions
        function getUserIdentifier() {
            let id = localStorage.getItem('nexgen_user_id');
            if (!id) {
                id = 'user_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('nexgen_user_id', id);
            }
            return id;
        }
    </script>
</body>
