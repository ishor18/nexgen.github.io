<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NexGen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>
    <nav class="glass navbar-main">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">Nex<span>Gen</span></a>
            <button class="hamburger" id="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="auth.html" class="btn btn-primary">Join Us</a>
            </div>
        </div>
    </nav>

    <main class="section">
        <div class="container" style="max-width: 900px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;">
                <div>
                    <h1 style="font-size: 3rem; margin-bottom: 1.5rem;">Get in <span style="color: var(--primary);">Touch</span></h1>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">Have questions about the platform or interested in collaboration? Drop us a message and our team will get back to you within 24 hours.</p>
                    <div style="display: grid; gap: 1.5rem;">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <div style="width: 40px; height: 40px; background: rgba(37, 99, 235, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <p>userhelp.nexgen@gmail.com</p>
                        </div>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <div style="width: 40px; height: 40px; background: rgba(37, 99, 235, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <p>Damak, Jhapa, Nepal</p>
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <!-- Status message -->
                    <div id="form-status" style="display:none; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>
                    <form id="contact-form" style="display: grid; gap: 1.2rem;">
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Name</label>
                            <input type="text" id="contact-name" required placeholder="Your name"
                                style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Email</label>
                            <input type="email" id="contact-email" required placeholder="your@email.com"
                                style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Message</label>
                            <textarea id="contact-message" required placeholder="Your message..."
                                style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 0.5rem; color: white; height: 120px; resize: vertical;"></textarea>
                        </div>
                        <button type="submit" id="contact-submit" class="btn btn-primary" style="justify-content: center;">
                            <i class="fa-solid fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="section" style="border-top: 1px solid var(--border);">
        <div class="container" style="text-align: center; color: var(--text-muted);">
            &copy; 2026 NexGen. All rights reserved.
        </div>
    </footer>

    <script src="main.js"></script>
    <script>
        // Mobile nav toggle
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navMenu = document.getElementById('nav-menu');
        if (hamburgerBtn && navMenu) {
            hamburgerBtn.addEventListener('click', () => navMenu.classList.toggle('active'));
        }

        // Contact form — saves to Supabase contact_messages table
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('contact-submit');
            const statusEl = document.getElementById('form-status');
            const name = document.getElementById('contact-name').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const message = document.getElementById('contact-message').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            statusEl.style.display = 'none';

            const { error } = await supabase.from('contact_messages').insert([{ name, email, message }]);

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';

            if (error) {
                statusEl.style.display = 'block';
                statusEl.style.background = 'rgba(239,68,68,0.1)';
                statusEl.style.border = '1px solid #ef4444';
                statusEl.style.color = '#f87171';
                statusEl.innerText = 'Failed to send: ' + error.message;
            } else {
                statusEl.style.display = 'block';
                statusEl.style.background = 'rgba(16,185,129,0.1)';
                statusEl.style.border = '1px solid #10b981';
                statusEl.style.color = '#34d399';
                statusEl.innerText = '✓ Message sent! We\'ll get back to you within 24 hours.';
                e.target.reset();
            }
        });
    </script>
</body>

</html>
